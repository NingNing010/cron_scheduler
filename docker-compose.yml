services:
  redis:
    image: redis:7-alpine
    container_name: cron_demo_redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: cron_demo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cron_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mariadb:
    image: mariadb:11.4
    container_name: cron_demo_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
      MARIADB_DATABASE: cron_demo_mariadb
      MARIADB_USER: mariadb
      MARIADB_PASSWORD: mariadb
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    container_name: cron_demo_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  mariadb_data:
  minio_data: